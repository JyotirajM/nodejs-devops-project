stages:
  - install
  - build

variables:
  APP_NAME: nodejs-devops-project

cache:
  paths:
    - node_modules/

install_dependencies:
  stage: install
  image: node:22-alpine
  script:
    - npm ci

build_docker_image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker version
    - docker build -t $APP_NAME .