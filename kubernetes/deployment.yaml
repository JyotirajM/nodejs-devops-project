apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-devops-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-devops
  template:
    metadata:
      labels:
        app: nodejs-devops
    spec:
      containers:
      - name: nodejs-devops
        image: hitesh008/nodejs-devops-project:latest
        ports:
        - containerPort: 8080