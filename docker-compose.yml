version: "3.9"

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: testdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  node-app:
    build: .
    container_name: nodejs-express-app
    restart: always
    depends_on:
      - mysql-db
    ports:
      - "8080:8080"

volumes:
  mysql-data: